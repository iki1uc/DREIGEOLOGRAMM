<!DOCTYPE html>
<html>
<head>
  <title>iki1uc · Live Engine</title>
  <style>
    body { background:#000; color:#0f0; font-family:monospace; }
    #console { white-space:pre; padding:20px; border:1px solid #0f0; }
    input { background:#111; color:#0f0; border:1px solid #0f0; padding:5px; }
  </style>
</head>
<body>

<h1>iki1uc · Live Engine Console</h1>

Input: <input id="engineInput" type="number" value="3">
<button onclick="runEngine()">RUN</button>

<div id="console"></div>

<script type="module">
  import { syn } from "./syn.js";
  import { qua } from "./qua.js";
  import { ROUTER } from "./ROUTER.js";
  import { atlantis } from "./one.room";
  import { generate81 } from "./81.room";
  import { COMMANDS } from "./COMMANDS.room";

  function log(msg) {
    document.getElementById("console").innerText += msg + "\n";
  }

  window.runEngine = function() {
    document.getElementById("console").innerText = "";

    const input = Number(document.getElementById("engineInput").value);

    const S = syn(input).syn;
    const Q = qua(input).quant;

    log("SYN: " + S);
    log("QUANT: " + Q);

    const route = ROUTER(S, Q);
    log("ROUTER: " + JSON.stringify(route));

    if (route.includes("TOR")) {
      const tor = atlantis(route[1]);
      log("ATLANTIS TOR: " + tor);
    }

    const matrix81 = generate81();
    log("81.room generated:");
    log(JSON.stringify(matrix81, null, 2));

    log("COMMANDS:");
    log(JSON.stringify(COMMANDS, null, 2));
  };
</script>

</body>
</html>
